services:
  - type: web
    name: siteguard-breakdown-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Pinned deps (psycopg2-binary 2.9.9) have no wheels for newer Pythons.
      - key: PYTHON_VERSION
        value: 3.11.9
      # Paste your Neon/Supabase connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Signs login tokens; Render generates a random value once.
      - key: SECRET_KEY
        generateValue: true
      # Initial password for the demo users (ramesh, deepak, vikram, ananya, rajeshwari). Set in dashboard.
      - key: DEMO_PASSWORD
        sync: false
