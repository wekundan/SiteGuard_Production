services:
  - type: web
    name: siteguard-breakdown-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siteguard-postgres
          property: connectionString

databases:
  - name: siteguard-postgres
    plan: free
    databaseName: machinery_tracker
    user: siteguard
