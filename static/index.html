<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>SiteGuard — Breakdown Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    @keyframes pulseRedBorder { 0%, 100% { border-color: #ef4444; } 50% { border-color: #fca5a5; } }
    .overdue-border { animation: pulseRedBorder 1.5s infinite ease-in-out; }
    .field { width: 100%; border-radius: 0.75rem; border: 2px solid #cbd5e1; background: #fff; padding: 0.6rem 0.75rem; font-size: 0.875rem; font-weight: 600; }
    .field:focus { border-color: #0f172a; outline: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 flex flex-col">

  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow">
    <div class="max-w-4xl mx-auto px-3 sm:px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 shrink-0">
        <span class="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-black">🛠️</span>
        <span class="font-extrabold text-base tracking-tight">SiteGuard</span>
      </div>
      <div id="user-bar" class="hidden flex items-center gap-1.5 min-w-0">
        <span id="user-label" class="text-xs font-semibold text-slate-300 truncate max-w-[80px] sm:max-w-none"></span>
        <button id="btn-reset-demo" type="button" class="hidden px-2 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">Reset Demo</button>
        <button id="btn-logout" type="button" class="px-2 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">Log out</button>
      </div>
    </div>
    <nav id="main-nav" class="hidden bg-slate-950 border-t border-slate-800">
      <div id="nav-tabs" class="max-w-4xl mx-auto flex text-center"></div>
    </nav>
  </header>

  <div id="toast-container" class="max-w-xl mx-auto w-full px-4 pt-4 hidden">
    <div id="toast-box" class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl border shadow-sm text-sm font-bold">
      <span id="toast-message"></span>
      <button id="btn-close-toast" type="button" class="text-xs opacity-70 hover:opacity-100">✕</button>
    </div>
  </div>

  <section id="login-view" class="flex-1 max-w-sm w-full mx-auto px-4 py-10">
    <form id="form-login" class="bg-white rounded-3xl shadow-md border border-slate-200 p-6 space-y-4">
      <h2 class="text-xl font-black text-slate-900 text-center">Log in</h2>
      <input id="login-username" type="text" autocomplete="username" autocapitalize="none" placeholder="Username" required class="field text-base" />
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required class="field text-base" />
      <div id="login-error" class="hidden text-sm font-bold text-red-700"></div>
      <button type="submit" class="w-full py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-black">Log in</button>
    </form>
  </section>

  <main id="main-wrapper" class="hidden flex-1 max-w-4xl w-full mx-auto px-4 py-6">

    <!-- Report a breakdown (Sr Civil Engineer / DEO) -->
    <section id="view-report" class="max-w-md mx-auto hidden">
      <div class="bg-white rounded-3xl shadow-md border border-slate-200 p-6 space-y-6">
        <h2 class="text-xl font-black text-center">Report Breakdown</h2>
        <form id="form-create-breakdown" class="space-y-6">
          <div>
            <label for="select-machine" class="block text-sm font-bold text-slate-600 mb-2">Machine Name</label>
            <select id="select-machine" class="w-full rounded-2xl border-2 border-slate-300 bg-slate-50 px-4 py-4 text-base font-bold focus:border-slate-900 focus:bg-white focus:outline-none"></select>
          </div>
          <button id="btn-submit-breakdown" type="submit" class="w-full py-6 px-6 rounded-2xl bg-red-600 hover:bg-red-700 active:scale-[0.99] disabled:bg-slate-300 disabled:text-slate-500 text-white font-black text-xl tracking-wide uppercase shadow-lg transition cursor-pointer">🚨 Report Breakdown</button>
        </form>
      </div>
    </section>

    <!-- My tasks: tickets waiting on the logged-in role -->
    <section id="view-tasks" class="max-w-lg mx-auto space-y-3 hidden"></section>

    <!-- Board: every ticket, read-only, with history -->
    <section id="view-board" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-black">All breakdowns</h2>
        <label class="text-xs font-bold text-slate-600 flex items-center gap-2"><input id="board-show-closed" type="checkbox" /> Show closed</label>
      </div>
      <div id="board-list" class="space-y-3"></div>
    </section>

    <!-- Dashboard -->
    <section id="view-dashboard" class="space-y-6 hidden">
      <div id="kpi-row" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-200"><h3 class="text-sm font-black uppercase tracking-wider text-slate-700">Where breakdowns are stuck</h3></div>
        <div class="overflow-x-auto"><table class="w-full text-left text-sm">
          <thead><tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500"><th class="py-3 px-4">Stage</th><th class="py-3 px-4 text-right">Open</th><th class="py-3 px-4 text-right">Past SLA</th><th class="py-3 px-4 text-right">Avg hours in stage</th></tr></thead>
          <tbody id="stage-table" class="divide-y divide-slate-200"></tbody>
        </table></div>
      </div>
    </section>
  </main>

  <script>
    // ========================================================================
    // Constants (the server enforces the same rules)
    // ========================================================================
    const TOKEN_KEY = "siteguard_token";

    const STATUS = {
      pending_inspection: { label: "Needs inspection", cls: "bg-amber-100 text-amber-900" },
      pending_parts_check: { label: "Site store check", cls: "bg-sky-100 text-sky-900" },
      pending_dispatch: { label: "Awaiting central store", cls: "bg-purple-100 text-purple-900" },
      in_transit: { label: "Spares in transit", cls: "bg-indigo-100 text-indigo-900" },
      pending_quotation: { label: "Needs vendor quotation", cls: "bg-sky-100 text-sky-900" },
      pending_approval: { label: "Awaiting approval", cls: "bg-purple-100 text-purple-900" },
      repair_in_progress: { label: "Repair in progress", cls: "bg-blue-100 text-blue-900" },
      cleared: { label: "Cleared, record pending", cls: "bg-emerald-100 text-emerald-900" },
      closed: { label: "Closed", cls: "bg-slate-200 text-slate-700" }
    };
    const STAGE_ORDER = Object.keys(STATUS).filter((s) => s !== "closed");

    const MECH_TASKS = ["pending_inspection", "pending_parts_check", "pending_quotation", "repair_in_progress"];
    const TASKS_BY_ROLE = {
      site_office: [],
      deo: ["cleared"],
      mech_engineer: MECH_TASKS,
      pm_incharge: [...MECH_TASKS, "cleared"],
      site_store: ["in_transit"],
      central_store: ["pending_dispatch"],
      management: ["pending_approval"]
    };
    const VIEW_LABEL = { report: "Report", tasks: "My tasks", board: "Board", dashboard: "Dashboard" };

    function viewsFor(role) {
      const v = [];
      if (role === "site_office" || role === "deo") v.push("report");
      if (TASKS_BY_ROLE[role].length) v.push("tasks");
      v.push("board");
      if (role === "management" || role === "pm_incharge") v.push("dashboard");
      return v;
    }

    let state = {
      me: null, machines: [], tickets: [], metrics: null,
      activeView: "report", drafts: {}, openHistory: {}, history: {},
      selectedMachineId: "", lastServerSignature: "", lastRenderAt: 0
    };

    // ========================================================================
    // Helpers
    // ========================================================================
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    const $ = (id) => document.getElementById(id);
    const getMachine = (id) => state.machines.find((m) => m.machine_id === id);
    const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });

    function daysFromNowDate(days) {
      return new Date(Date.now() + days * 86400000).toISOString().split("T")[0];
    }
    function formatDuration(hours) {
      const mins = Math.max(0, Math.round((hours || 0) * 60));
      const h = Math.floor(mins / 60), m = mins % 60;
      if (h >= 48) return `${Math.floor(h / 24)}d ${h % 24}h`;
      return h === 0 ? `${m}m` : `${h}h ${m}m`;
    }
    function formatDateTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: true });
    }
    function hoursSince(iso) { return (Date.now() - new Date(iso).getTime()) / 3600000; }

    function slaBadge(t) {
      if (!t.sla_due_at || t.status === "closed") return "";
      const hrs = (new Date(t.sla_due_at).getTime() - Date.now()) / 3600000;
      const overdue = t.is_overdue || hrs < 0;
      const text = overdue ? `Overdue ${formatDuration(-hrs)}` : `Due in ${formatDuration(hrs)}`;
      const cls = overdue ? "bg-red-600 text-white" : "bg-slate-100 text-slate-700";
      return `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-extrabold whitespace-nowrap ${cls}">${text}</span>`;
    }
    function statusBadge(t) {
      const st = STATUS[t.status] || { label: t.status, cls: "bg-slate-100" };
      return `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold ${st.cls}">${st.label}</span>`;
    }

    function showToast(message, isError = false) {
      $("toast-message").textContent = message;
      $("toast-box").className = "flex items-center justify-between gap-3 px-4 py-3 rounded-xl border shadow-sm text-sm font-bold " +
        (isError ? "bg-red-50 border-red-300 text-red-900" : "bg-emerald-50 border-emerald-300 text-emerald-900");
      $("toast-container").classList.remove("hidden");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => $("toast-container").classList.add("hidden"), 4000);
    }

    // ========================================================================
    // API
    // ========================================================================
    class ApiError extends Error {
      constructor(message, status) { super(message); this.status = status; }
    }
    function errorText(data) {
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d)) return d.map((x) => x.msg.replace(/^Value error, /, "")).join("; ");
      return "Request failed.";
    }
    async function apiRequest(method, path, body = null) {
      const headers = { "Content-Type": "application/json" };
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) headers.Authorization = "Bearer " + token;
      let res;
      try {
        res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      } catch (e) {
        throw new ApiError("Cannot reach the server. Check your connection and try again.", 0);
      }
      const data = await res.json().catch(() => null);
      if (res.status === 401 && path !== "/api/auth/login") {
        showLogin();
        throw new ApiError("Please log in again.", 401);
      }
      if (!res.ok) throw new ApiError(errorText(data), res.status);
      return data;
    }

    async function loadAll() {
      const data = await apiRequest("GET", "/api/bootstrap");
      state.me = data.me;
      state.machines = data.machines;
      state.tickets = data.tickets;
      state.metrics = viewsFor(data.me.role).includes("dashboard") ? await apiRequest("GET", "/api/dashboard/metrics") : null;
      return data;
    }
    async function refreshFromServer() {
      await loadAll();
      renderAll();
    }

    // Runs a server action, then re-syncs. On failure shows the server's reason and re-syncs too.
    async function act(action, successMessage, ticketId = null) {
      try {
        await action();
        if (ticketId) Object.keys(state.drafts).filter((k) => k.startsWith(ticketId + ":")).forEach((k) => delete state.drafts[k]);
        showToast(successMessage);
        await refreshFromServer();
        return true;
      } catch (e) {
        showToast(e.message, true);
        if (e.status !== 401) await refreshFromServer().catch(() => {});
        return false;
      }
    }

    async function pullFromServerIfIdle() {
      if (!state.me) return;
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return; // never re-render while typing
      try {
        await loadAll();
        const sig = JSON.stringify({
          m: state.machines,
          t: state.tickets.map((x) => [x.ticket_id, x.status, x.is_overdue, x.eta_date, x.approval_note])
        });
        // Also re-render about once a minute so "due in / overdue by" labels stay fresh.
        if (sig !== state.lastServerSignature || Date.now() - state.lastRenderAt > 60000) {
          state.lastServerSignature = sig;
          renderAll();
        }
      } catch (e) { /* transient network error: keep last data, retry next poll */ }
    }

    // ========================================================================
    // Session
    // ========================================================================
    function showLogin() {
      localStorage.removeItem(TOKEN_KEY);
      state.me = null;
      state.lastServerSignature = "";
      $("login-view").classList.remove("hidden");
      ["main-wrapper", "main-nav", "user-bar"].forEach((id) => $(id).classList.add("hidden"));
    }
    async function startSession() {
      await loadAll();
      const views = viewsFor(state.me.role);
      state.activeView = views.includes("tasks") ? "tasks" : views[0];
      $("login-view").classList.add("hidden");
      ["main-wrapper", "main-nav", "user-bar"].forEach((id) => $(id).classList.remove("hidden"));
      $("user-label").textContent = state.me.name;
      $("btn-reset-demo").classList.toggle("hidden", state.me.role !== "management");
      renderAll();
    }

    // ========================================================================
    // Rendering
    // ========================================================================
    function tasksFor(role) {
      const mine = TASKS_BY_ROLE[role];
      return state.tickets
        .filter((t) => mine.includes(t.status))
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    }

    function renderAll() {
      if (!state.me) return;
      state.lastRenderAt = Date.now();
      const views = viewsFor(state.me.role);
      if (!views.includes(state.activeView)) state.activeView = views[0];

      const taskCount = tasksFor(state.me.role).length;
      $("nav-tabs").innerHTML = views.map((v) => {
        const active = v === state.activeView;
        const badge = v === "tasks" && taskCount ? `<span class="px-1.5 rounded-full text-[11px] bg-red-600 text-white">${taskCount}</span>` : "";
        return `<button type="button" data-view-tab="${v}" class="flex-1 py-3 text-xs sm:text-sm font-bold border-b-2 flex items-center justify-center gap-1.5 ${
          active ? "border-amber-400 text-amber-300 bg-slate-900" : "border-transparent text-slate-400 hover:text-white"}">${VIEW_LABEL[v]} ${badge}</button>`;
      }).join("");

      ["report", "tasks", "board", "dashboard"].forEach((v) => $(`view-${v}`).classList.toggle("hidden", v !== state.activeView));
      if (state.activeView === "report") renderReport();
      if (state.activeView === "tasks") renderTasks();
      if (state.activeView === "board") renderBoard();
      if (state.activeView === "dashboard") renderDashboard();
    }

    function renderReport() {
      const sel = $("select-machine");
      const active = state.machines.filter((m) => m.status === "active");
      if (!getMachine(state.selectedMachineId) || getMachine(state.selectedMachineId).status !== "active") {
        state.selectedMachineId = active[0] ? active[0].machine_id : "";
      }
      if (!active.length) {
        sel.innerHTML = `<option value="">All machines are currently broken down</option>`;
      } else {
        sel.innerHTML = state.machines.map((m) =>
          `<option value="${m.machine_id}" ${m.status === "broken_down" ? "disabled" : ""} ${m.machine_id === state.selectedMachineId ? "selected" : ""}>${
            m.status === "broken_down" ? "🔴 [Broken] " : "🟢 "}${esc(m.name)} (${esc(m.location)})</option>`).join("");
      }
      $("btn-submit-breakdown").disabled = !active.length;
    }

    // ---- task cards -------------------------------------------------------
    const dv = (t, f) => esc(state.drafts[`${t.ticket_id}:${f}`] || "");
    const input = (t, f, attrs = "", tag = "input") =>
      tag === "textarea"
        ? `<textarea data-draft="${t.ticket_id}:${f}" rows="2" ${attrs} class="field">${dv(t, f)}</textarea>`
        : `<input data-draft="${t.ticket_id}:${f}" value="${dv(t, f)}" ${attrs} class="field" />`;
    const btn = (action, t, label, color) =>
      `<button type="button" data-action="${action}" data-ticket="${t.ticket_id}" class="py-3 px-3 rounded-xl font-bold text-xs sm:text-sm text-white ${color}">${label}</button>`;

    function ticketDetails(t) {
      const rows = [];
      if (t.issue_description) rows.push(`<div><span class="text-slate-500">Issue:</span> ${esc(t.issue_description)}</div>`);
      if (t.repair_venue) rows.push(`<div><span class="text-slate-500">Repair:</span> ${t.repair_venue === "in_house" ? "In-house workshop" : "Outside workshop"}</div>`);
      if (t.parts_required) rows.push(`<div><span class="text-slate-500">Parts required:</span> ${esc(t.parts_required)}</div>`);
      if (t.dispatch_details) rows.push(`<div><span class="text-slate-500">Dispatch:</span> ${esc(t.dispatch_details)}</div>`);
      if (t.vendor_name) rows.push(`<div><span class="text-slate-500">Vendor:</span> ${esc(t.vendor_name)} — <strong>${inr(t.quote_amount)}</strong>${t.quote_details ? ` (${esc(t.quote_details)})` : ""}</div>`);
      if (t.eta_date) rows.push(`<div><span class="text-slate-500">ETA:</span> ${t.eta_date}</div>`);
      if (t.approval_note) rows.push(`<div class="text-red-700"><span class="font-bold">Management note:</span> ${esc(t.approval_note)}</div>`);
      if (t.root_cause) rows.push(`<div><span class="text-slate-500">Root cause:</span> ${esc(t.root_cause)}</div>`);
      if (t.repair_cost != null) rows.push(`<div><span class="text-slate-500">Repair cost:</span> ${inr(t.repair_cost)}</div>`);
      return rows.length ? `<div class="text-xs text-slate-700 space-y-0.5 mt-2">${rows.join("")}</div>` : "";
    }

    function taskActions(t) {
      switch (t.status) {
        case "pending_inspection":
          return `${input(t, "issue", 'placeholder="Inspection findings: what is wrong?"', "textarea")}
            <div class="grid grid-cols-2 gap-2.5">
              ${btn("inspect_in_house", t, "In-house workshop", "bg-sky-700 hover:bg-sky-800")}
              ${btn("inspect_outside", t, "Outside workshop", "bg-purple-700 hover:bg-purple-800")}
            </div>`;
        case "pending_parts_check":
          return `<div class="text-xs font-bold text-slate-600">Check the site store for the spare parts.</div>
            ${input(t, "parts", 'placeholder="If not in stock: list the parts to requisition"', "textarea")}
            <div class="grid grid-cols-2 gap-2.5">
              ${btn("parts_available", t, "Parts available", "bg-emerald-600 hover:bg-emerald-700")}
              ${btn("parts_missing", t, "Raise requisition", "bg-purple-700 hover:bg-purple-800")}
            </div>`;
        case "pending_dispatch":
          return `${input(t, "dispatch", 'placeholder="Dispatch details: vehicle, docket, quantity"')}
            <input data-draft="${t.ticket_id}:eta" type="date" value="${dv(t, "eta") || daysFromNowDate(2)}" class="field" />
            ${btn("dispatch", t, "Confirm dispatch", "bg-purple-700 hover:bg-purple-800 w-full")}`;
        case "in_transit":
          return btn("receive", t, "Confirm spares received", "bg-emerald-600 hover:bg-emerald-700 w-full");
        case "pending_quotation":
          return `${input(t, "vendor", 'placeholder="Vendor name"')}
            <input data-draft="${t.ticket_id}:amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Quoted amount (₹)" value="${dv(t, "amount")}" class="field" />
            ${input(t, "qdetails", 'placeholder="Scope, warranty, duration (optional)"')}
            <input data-draft="${t.ticket_id}:eta" type="date" value="${dv(t, "eta")}" class="field" title="Expected completion (optional)" />
            ${btn("quotation", t, "Submit to management", "bg-purple-700 hover:bg-purple-800 w-full")}`;
        case "pending_approval":
          return `${input(t, "note", 'placeholder="Note (required if rejecting)"')}
            <div class="grid grid-cols-2 gap-2.5">
              ${btn("approve", t, "Approve", "bg-emerald-600 hover:bg-emerald-700")}
              ${btn("reject", t, "Reject", "bg-red-600 hover:bg-red-700")}
            </div>`;
        case "repair_in_progress":
          return btn("clear", t, "✓ Mark breakdown cleared", "bg-emerald-600 hover:bg-emerald-700 w-full");
        case "cleared":
          return `<div class="text-xs font-bold text-slate-600">Downtime so far: ${formatDuration(t.downtime_hours)}. Log the closure record.</div>
            ${input(t, "root", 'placeholder="Root cause"', "textarea")}
            <input data-draft="${t.ticket_id}:cost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Total repair cost (₹)" value="${dv(t, "cost")}" class="field" />
            ${input(t, "cnotes", 'placeholder="Notes (optional)"')}
            ${btn("close", t, "Close report", "bg-slate-900 hover:bg-slate-800 w-full")}`;
        default:
          return "";
      }
    }

    function ticketHeader(t) {
      const m = getMachine(t.machine_id);
      const age = formatDuration(hoursSince(t.created_at));
      return `<div class="flex items-start justify-between gap-3">
        <div>
          <div class="font-black text-base">${esc(m ? m.name : "Machine")}</div>
          <div class="text-xs text-slate-500">${esc(m ? m.location : "")} • Reported ${age} ago</div>
        </div>
        <div class="flex flex-col items-end gap-1">${statusBadge(t)}${slaBadge(t)}</div>
      </div>`;
    }

    function renderTasks() {
      const list = tasksFor(state.me.role);
      $("view-tasks").innerHTML = list.length === 0
        ? `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-sm font-semibold text-slate-500">Nothing is waiting on you.</div>`
        : list.map((t) => `
          <div class="bg-white rounded-2xl p-4 border-2 shadow-sm space-y-3 ${t.is_overdue ? "overdue-border border-red-500" : "border-slate-200"}">
            ${ticketHeader(t)}${ticketDetails(t)}
            <div class="space-y-2.5">${taskActions(t)}</div>
          </div>`).join("");
    }

    function renderBoard() {
      const showClosed = $("board-show-closed").checked;
      const list = state.tickets
        .filter((t) => showClosed || t.status !== "closed")
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      $("board-list").innerHTML = list.length === 0
        ? `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-sm font-semibold text-slate-500">No breakdowns.</div>`
        : list.map((t) => {
          const open = !!state.openHistory[t.ticket_id];
          const events = state.history[t.ticket_id];
          const timeline = open
            ? `<div class="mt-3 border-t border-slate-200 pt-3 space-y-1.5 text-xs">${
              !events ? "Loading…" : events.map((e) => `
                <div class="flex gap-2"><span class="text-slate-400 whitespace-nowrap">${formatDateTime(e.created_at)}</span>
                <span><strong>${esc((STATUS[e.to_status] || { label: e.to_status }).label)}</strong> — ${esc(e.actor)}${e.note ? `: ${esc(e.note)}` : ""}</span></div>`).join("")}</div>`
            : "";
          return `<div class="bg-white rounded-2xl p-4 border shadow-sm ${t.is_overdue ? "border-red-400" : "border-slate-200"}">
            ${ticketHeader(t)}${ticketDetails(t)}
            <div class="flex items-center justify-between mt-2">
              <span class="text-xs text-slate-500">Downtime ${formatDuration(t.downtime_hours)}</span>
              <button type="button" data-history="${t.ticket_id}" class="text-xs font-bold text-slate-600 underline">${open ? "Hide history" : "History"}</button>
            </div>${timeline}</div>`;
        }).join("");
    }

    function renderDashboard() {
      const mt = state.metrics;
      if (!mt) return;
      const pastSla = Object.values(mt.overdue_by_stage).reduce((a, b) => a + b, 0);
      const kpi = (label, value, cls = "text-slate-900", sub = "") =>
        `<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm text-center">
          <div class="text-[11px] font-bold uppercase text-slate-500">${label}</div>
          <div class="text-3xl font-black mt-1 ${cls}">${value}</div><div class="text-xs text-slate-400 mt-0.5">${sub}</div></div>`;
      $("kpi-row").innerHTML =
        kpi("Machines broken", mt.total_machines_broken, "text-red-600", `of ${state.machines.length}`) +
        kpi("Past SLA", pastSla, pastSla ? "text-red-600" : "text-emerald-600") +
        kpi("Avg downtime", mt.average_downtime_hours == null ? "—" : formatDuration(mt.average_downtime_hours), "text-slate-900", `${mt.cleared_tickets} cleared`) +
        kpi("Repair cost", inr(mt.total_repair_cost), "text-slate-900", `${mt.closed_tickets} closed`);
      $("stage-table").innerHTML = STAGE_ORDER.map((s) => {
        const over = mt.overdue_by_stage[s] || 0;
        const avg = mt.stage_average_hours[s];
        return `<tr><td class="py-3 px-4">${statusBadge({ status: s })}</td>
          <td class="py-3 px-4 text-right font-bold">${mt.tickets_by_stage[s] || 0}</td>
          <td class="py-3 px-4 text-right font-bold ${over ? "text-red-600" : "text-slate-400"}">${over}</td>
          <td class="py-3 px-4 text-right text-slate-600">${avg == null ? "—" : formatDuration(avg)}</td></tr>`;
      }).join("");
    }

    // ========================================================================
    // Actions
    // ========================================================================
    function field(id, name) {
      const el = document.querySelector(`[data-draft="${id}:${name}"]`);
      return el ? el.value.trim() : "";
    }
    function fail(msg) { showToast(msg, true); }

    async function runTaskAction(action, id) {
      const put = (path, body) => () => apiRequest("PUT", `/api/tickets/${id}/${path}`, body);
      switch (action) {
        case "inspect_in_house":
        case "inspect_outside": {
          const issue = field(id, "issue");
          if (issue.length < 3) return fail("Enter the inspection findings first.");
          return act(put("inspect", { issue_description: issue, repair_venue: action === "inspect_in_house" ? "in_house" : "outside" }),
            action === "inspect_in_house" ? "Sent to in-house workshop." : "Sent for outside repair quotation.", id);
        }
        case "parts_available":
          return act(put("parts-check", { available: true }), "Spares available. Repair started.", id);
        case "parts_missing": {
          const parts = field(id, "parts");
          if (!parts) return fail("List the parts to requisition.");
          return act(put("parts-check", { available: false, parts_required: parts }), "Requisition sent to central store.", id);
        }
        case "dispatch": {
          const details = field(id, "dispatch"), eta = field(id, "eta");
          if (details.length < 2 || !eta) return fail("Enter dispatch details and the arrival date.");
          return act(put("dispatch", { dispatch_details: details, eta_date: eta }), "Dispatch recorded.", id);
        }
        case "receive":
          return act(put("receive", null), "Receipt confirmed. Repair started.", id);
        case "quotation": {
          const vendor = field(id, "vendor"), amount = parseFloat(field(id, "amount"));
          if (vendor.length < 2) return fail("Enter the vendor name.");
          if (!(amount > 0)) return fail("Enter the quoted amount.");
          return act(put("quotation", { vendor_name: vendor, quote_amount: amount, quote_details: field(id, "qdetails") || null, eta_date: field(id, "eta") || null }),
            "Quotation sent to management.", id);
        }
        case "approve":
          return act(put("approval", { approved: true, note: field(id, "note") || null }), "Quotation approved.", id);
        case "reject": {
          const note = field(id, "note");
          if (!note) return fail("Give a reason for rejecting.");
          return act(put("approval", { approved: false, note }), "Quotation sent back.", id);
        }
        case "clear":
          return act(put("clear", null), "Breakdown cleared. Machine is active again.", id);
        case "close": {
          const root = field(id, "root"), cost = parseFloat(field(id, "cost"));
          if (root.length < 3) return fail("Enter the root cause.");
          if (!(cost >= 0)) return fail("Enter the total repair cost (0 if none).");
          return act(put("close", { root_cause: root, repair_cost: cost, closure_notes: field(id, "cnotes") || null }), "Report closed.", id);
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      $("btn-close-toast").addEventListener("click", () => $("toast-container").classList.add("hidden"));

      $("nav-tabs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-view-tab]");
        if (!b) return;
        state.activeView = b.getAttribute("data-view-tab");
        renderAll();
      });

      $("btn-reset-demo").addEventListener("click", async () => {
        if (!confirm("Delete all tickets and restore the demo data?")) return;
        state.drafts = {};
        await act(() => apiRequest("POST", "/api/reset-demo"), "Demo data reset.");
      });

      $("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errEl = $("login-error");
        errEl.classList.add("hidden");
        try {
          const res = await apiRequest("POST", "/api/auth/login", {
            username: $("login-username").value.trim(),
            password: $("login-password").value
          });
          localStorage.setItem(TOKEN_KEY, res.token);
          $("login-password").value = "";
          await startSession();
        } catch (err) {
          errEl.textContent = err.message;
          errEl.classList.remove("hidden");
        }
      });
      $("btn-logout").addEventListener("click", showLogin);

      $("select-machine").addEventListener("change", (e) => { state.selectedMachineId = e.target.value; });
      $("form-create-breakdown").addEventListener("submit", async (e) => {
        e.preventDefault();
        const machine = getMachine(state.selectedMachineId);
        if (!machine || machine.status !== "active") return;
        await act(() => apiRequest("POST", "/api/tickets/create", { machine_id: machine.machine_id }), `Breakdown reported for ${machine.name}`);
      });

      // Keep typed text across re-renders.
      $("view-tasks").addEventListener("input", (e) => {
        const key = e.target.getAttribute("data-draft");
        if (key) state.drafts[key] = e.target.value;
      });
      $("view-tasks").addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (b) runTaskAction(b.getAttribute("data-action"), b.getAttribute("data-ticket"));
      });

      $("board-show-closed").addEventListener("change", renderBoard);
      $("board-list").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-history]");
        if (!b) return;
        const id = b.getAttribute("data-history");
        state.openHistory[id] = !state.openHistory[id];
        renderBoard();
        if (state.openHistory[id]) {
          try {
            state.history[id] = await apiRequest("GET", `/api/tickets/${id}/events`);
            renderBoard();
          } catch (err) { showToast(err.message, true); }
        }
      });

      setInterval(pullFromServerIfIdle, 6000);
      if (localStorage.getItem(TOKEN_KEY)) startSession().catch(showLogin);
      else showLogin();
    });
  </script>
</body>
</html>
