<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10253b" />
  <title>SiteGuard — Breakdown Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --ink: #161a22; --muted: #6b7280; --line: #e6e3dc; --paper: #f7f6f3;
      --navy: #10253b; --navy-2: #1b3752; --gold: #c9973f;
    }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
    .serif { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
    .label { font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px -20px rgba(16,24,40,.22); }
    .card.overdue { border-color: #f3b6c0; box-shadow: 0 1px 2px rgba(190,18,60,.06), 0 12px 32px -18px rgba(190,18,60,.35); }

    .field { width: 100%; border-radius: 12px; border: 1px solid #d6d3cb; background: #fff; padding: .65rem .8rem;
      font-size: .875rem; font-weight: 500; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
    .field::placeholder { color: #9ca3af; font-weight: 400; }
    .field:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16,37,59,.12); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; width: 100%; padding: .72rem 1rem;
      border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: .85rem; cursor: pointer; transition: background .15s, transform .05s; }
    .btn:active { transform: scale(.985); }
    .btn:disabled { background: #e5e2da; color: #9a958a; cursor: not-allowed; }
    .btn-primary { background: var(--navy); color: #fff; } .btn-primary:hover { background: var(--navy-2); }
    .btn-success { background: #0f766e; color: #fff; } .btn-success:hover { background: #115e59; }
    .btn-alert { background: #be123c; color: #fff; } .btn-alert:hover { background: #9f1239; }
    .btn-outline { background: #fff; color: var(--navy); border-color: #cdd3dc; } .btn-outline:hover { background: #f1f4f8; }
    .btn-danger { background: #fff; color: #be123c; border-color: #f4c2cb; } .btn-danger:hover { background: #fff1f3; }
    .btn-ghost { background: rgba(255,255,255,.08); color: #d6dee8; width: auto; padding: .35rem .7rem; font-size: .75rem; border-radius: 9px; }
    .btn-ghost:hover { background: rgba(255,255,255,.16); color: #fff; }

    .pill { display: inline-flex; align-items: center; gap: .4rem; padding: .22rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 600; white-space: nowrap; }
    .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
    .t-amber { background: #fdf3dc; color: #8a5a00; } .t-sky { background: #e7f2fa; color: #0b5a8a; }
    .t-violet { background: #f0ebfa; color: #5b3db0; } .t-indigo { background: #e9ebfb; color: #3730a3; }
    .t-blue { background: #e5effd; color: #1d4ed8; } .t-green { background: #e2f4ec; color: #0b6b52; }
    .t-gray { background: #efede7; color: #57534e; } .t-red { background: #fde7eb; color: #be123c; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .t-red i { animation: blink 1.4s infinite ease-in-out; }

    .tl { position: relative; padding-left: 1.15rem; }
    .tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
    .tl-item { position: relative; padding-bottom: .65rem; }
    .tl-item::before { content: ""; position: absolute; left: -1.15rem; top: .3rem; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px #fff; }

    .tab { flex: 1; padding: .8rem .5rem; font-size: .8rem; font-weight: 600; color: #8da0b4; border-bottom: 2px solid transparent;
      display: flex; align-items: center; justify-content: center; gap: .4rem; transition: color .15s; }
    .tab { white-space: nowrap; }
    @media (max-width: 360px) { .tab { font-size: .72rem; padding: .8rem .2rem; gap: .25rem; } }
    .tab:hover { color: #fff; } .tab.active { color: #fff; border-bottom-color: var(--gold); }
    .count { background: var(--gold); color: #1a1205; border-radius: 999px; font-size: .68rem; font-weight: 700; padding: 0 .4rem; min-width: 1.1rem; text-align: center; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-30" style="background: var(--navy);">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-x-2 gap-y-2">
      <div class="flex items-center gap-2.5 shrink-0">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center serif text-lg font-semibold" style="background: var(--gold); color: #1a1205;">S</span>
        <span class="serif text-white text-lg font-semibold">SiteGuard</span>
      </div>
      <div id="user-bar" class="hidden flex items-center gap-1.5 min-w-0">
        <span id="user-label" class="text-xs font-medium truncate max-w-[90px] sm:max-w-none" style="color:#b8c5d3;"></span>
        <button id="btn-reset-demo" type="button" class="hidden btn btn-ghost whitespace-nowrap">Reset demo</button>
        <button id="btn-logout" type="button" class="btn btn-ghost whitespace-nowrap">Log out</button>
      </div>
    </div>
    <nav id="main-nav" class="hidden" style="background: var(--navy); border-top: 1px solid rgba(255,255,255,.08);">
      <div id="nav-tabs" class="max-w-4xl mx-auto flex"></div>
    </nav>
  </header>

  <div id="toast-container" class="hidden fixed top-16 inset-x-0 z-40 px-4 pointer-events-none">
    <div id="toast-box" class="pointer-events-auto max-w-md mx-auto flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium">
      <span id="toast-message"></span>
      <button id="btn-close-toast" type="button" class="text-xs opacity-70 hover:opacity-100" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <section id="login-view" class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6">
        <span class="inline-flex w-12 h-12 rounded-xl items-center justify-center serif text-2xl font-semibold" style="background: var(--navy); color: var(--gold);">S</span>
        <h1 class="serif text-3xl mt-3" style="color: var(--navy);">SiteGuard</h1>
        <p class="text-sm mt-1" style="color: var(--muted);">Machinery breakdown tracking</p>
      </div>
      <form id="form-login" class="card p-6 space-y-3">
        <input id="login-username" type="text" autocomplete="username" autocapitalize="none" placeholder="Username" required class="field" />
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required class="field" />
        <div id="login-error" class="hidden text-sm font-medium" style="color:#be123c;"></div>
        <button type="submit" class="btn btn-primary" style="padding:.8rem 1rem;">Log in</button>
      </form>
    </div>
  </section>

  <main id="main-wrapper" class="hidden flex-1 max-w-4xl w-full mx-auto px-4 py-6">

    <section id="view-report" class="max-w-md mx-auto hidden">
      <div class="card p-6 sm:p-7 space-y-5">
        <div>
          <h2 class="serif text-2xl" style="color: var(--navy);">Report a breakdown</h2>
          <p class="text-sm mt-1" style="color: var(--muted);">Choose the machine that has stopped working.</p>
        </div>
        <form id="form-create-breakdown" class="space-y-5">
          <div>
            <label for="select-machine" class="label block mb-2">Machine</label>
            <select id="select-machine" class="field" style="padding:.9rem .9rem; font-weight:600;"></select>
          </div>
          <button id="btn-submit-breakdown" type="submit" class="btn btn-alert" style="padding:1.1rem 1rem; font-size:1rem; border-radius:14px;">Report breakdown</button>
        </form>
      </div>
    </section>

    <section id="view-tasks" class="max-w-lg mx-auto space-y-4 hidden"></section>

    <section id="view-board" class="space-y-4 hidden">
      <div class="flex items-center justify-between">
        <h2 class="serif text-2xl" style="color: var(--navy);">All breakdowns</h2>
        <label class="text-xs font-medium flex items-center gap-2" style="color: var(--muted);"><input id="board-show-closed" type="checkbox" class="rounded" /> Show closed</label>
      </div>
      <div id="board-list" class="space-y-4"></div>
    </section>

    <section id="view-dashboard" class="space-y-5 hidden">
      <h2 class="serif text-2xl" style="color: var(--navy);">Dashboard</h2>
      <div id="kpi-row" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      <div class="card overflow-hidden">
        <div class="px-5 py-4" style="border-bottom:1px solid var(--line);"><span class="label">Where breakdowns are stuck</span></div>
        <div class="overflow-x-auto"><table class="w-full text-left text-sm">
          <thead><tr class="label" style="background:#faf9f6;"><th class="py-3 px-5 font-semibold">Stage</th><th class="py-3 px-4 text-right font-semibold">Open</th><th class="py-3 px-4 text-right font-semibold">Past SLA</th><th class="py-3 px-5 text-right font-semibold">Avg time</th></tr></thead>
          <tbody id="stage-table"></tbody>
        </table></div>
      </div>
    </section>
  </main>

  <script>
    // ========================================================================
    // Constants (the server enforces the same rules)
    // ========================================================================
    const TOKEN_KEY = "siteguard_token";

    const STATUS = {
      pending_inspection: { label: "Needs inspection", tone: "t-amber" },
      pending_parts_check: { label: "Site store check", tone: "t-sky" },
      pending_dispatch: { label: "Awaiting central store", tone: "t-violet" },
      in_transit: { label: "Spares in transit", tone: "t-indigo" },
      pending_quotation: { label: "Needs vendor quotation", tone: "t-sky" },
      pending_approval: { label: "Awaiting approval", tone: "t-violet" },
      repair_in_progress: { label: "Repair in progress", tone: "t-blue" },
      cleared: { label: "Cleared, record pending", tone: "t-green" },
      closed: { label: "Closed", tone: "t-gray" }
    };
    const STAGE_ORDER = Object.keys(STATUS).filter((s) => s !== "closed");

    const MECH_TASKS = ["pending_inspection", "pending_parts_check", "pending_quotation", "repair_in_progress"];
    const TASKS_BY_ROLE = {
      site_office: [],
      deo: ["cleared"],
      mech_engineer: MECH_TASKS,
      pm_incharge: [...MECH_TASKS, "cleared"],
      site_store: ["in_transit"],
      central_store: ["pending_dispatch"],
      management: ["pending_approval"]
    };
    const VIEW_LABEL = { report: "Report", tasks: "My tasks", board: "Board", dashboard: "Dashboard" };

    function viewsFor(role) {
      const v = [];
      if (role === "site_office" || role === "deo") v.push("report");
      if (TASKS_BY_ROLE[role].length) v.push("tasks");
      v.push("board");
      if (role === "management" || role === "pm_incharge") v.push("dashboard");
      return v;
    }

    let state = {
      me: null, machines: [], tickets: [], metrics: null,
      activeView: "report", drafts: {}, openHistory: {}, history: {},
      selectedMachineId: "", lastServerSignature: "", lastRenderAt: 0
    };

    // ========================================================================
    // Helpers
    // ========================================================================
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    const $ = (id) => document.getElementById(id);
    const getMachine = (id) => state.machines.find((m) => m.machine_id === id);
    const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });

    function daysFromNowDate(days) {
      return new Date(Date.now() + days * 86400000).toISOString().split("T")[0];
    }
    function formatDuration(hours) {
      const mins = Math.max(0, Math.round((hours || 0) * 60));
      const h = Math.floor(mins / 60), m = mins % 60;
      if (h >= 48) return `${Math.floor(h / 24)}d ${h % 24}h`;
      return h === 0 ? `${m}m` : `${h}h ${m}m`;
    }
    function formatDateTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: true });
    }
    function hoursSince(iso) { return (Date.now() - new Date(iso).getTime()) / 3600000; }

    function slaBadge(t) {
      if (!t.sla_due_at || t.status === "closed") return "";
      const hrs = (new Date(t.sla_due_at).getTime() - Date.now()) / 3600000;
      const overdue = t.is_overdue || hrs < 0;
      return overdue
        ? `<span class="pill t-red"><i></i>Overdue ${formatDuration(-hrs)}</span>`
        : `<span class="pill t-gray">Due in ${formatDuration(hrs)}</span>`;
    }
    function statusBadge(t) {
      const st = STATUS[t.status] || { label: t.status, tone: "t-gray" };
      return `<span class="pill ${st.tone}"><i></i>${st.label}</span>`;
    }

    function showToast(message, isError = false) {
      $("toast-message").textContent = message;
      $("toast-box").style.background = isError ? "#7f1d33" : "#10253b";
      $("toast-box").style.color = "#fff";
      $("toast-container").classList.remove("hidden");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => $("toast-container").classList.add("hidden"), 4000);
    }

    // ========================================================================
    // API
    // ========================================================================
    class ApiError extends Error {
      constructor(message, status) { super(message); this.status = status; }
    }
    function errorText(data) {
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d)) return d.map((x) => x.msg.replace(/^Value error, /, "")).join("; ");
      return "Request failed.";
    }
    async function apiRequest(method, path, body = null) {
      const headers = { "Content-Type": "application/json" };
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) headers.Authorization = "Bearer " + token;
      let res;
      try {
        res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      } catch (e) {
        throw new ApiError("Cannot reach the server. Check your connection and try again.", 0);
      }
      const data = await res.json().catch(() => null);
      if (res.status === 401 && path !== "/api/auth/login") {
        showLogin();
        throw new ApiError("Please log in again.", 401);
      }
      if (!res.ok) throw new ApiError(errorText(data), res.status);
      return data;
    }

    async function loadAll() {
      const data = await apiRequest("GET", "/api/bootstrap");
      state.me = data.me;
      state.machines = data.machines;
      state.tickets = data.tickets;
      state.metrics = viewsFor(data.me.role).includes("dashboard") ? await apiRequest("GET", "/api/dashboard/metrics") : null;
      return data;
    }
    async function refreshFromServer() {
      await loadAll();
      renderAll();
    }

    // Runs a server action, then re-syncs. On failure shows the server's reason and re-syncs too.
    async function act(action, successMessage, ticketId = null) {
      try {
        await action();
        if (ticketId) Object.keys(state.drafts).filter((k) => k.startsWith(ticketId + ":")).forEach((k) => delete state.drafts[k]);
        showToast(successMessage);
        await refreshFromServer();
        return true;
      } catch (e) {
        showToast(e.message, true);
        if (e.status !== 401) await refreshFromServer().catch(() => {});
        return false;
      }
    }

    async function pullFromServerIfIdle() {
      if (!state.me) return;
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return; // never re-render while typing
      try {
        await loadAll();
        const sig = JSON.stringify({
          m: state.machines,
          t: state.tickets.map((x) => [x.ticket_id, x.status, x.is_overdue, x.eta_date, x.approval_note])
        });
        // Also re-render about once a minute so "due in / overdue by" labels stay fresh.
        if (sig !== state.lastServerSignature || Date.now() - state.lastRenderAt > 60000) {
          state.lastServerSignature = sig;
          renderAll();
        }
      } catch (e) { /* transient network error: keep last data, retry next poll */ }
    }

    // ========================================================================
    // Session
    // ========================================================================
    function showLogin() {
      localStorage.removeItem(TOKEN_KEY);
      state.me = null;
      state.lastServerSignature = "";
      $("login-view").classList.remove("hidden");
      ["main-wrapper", "main-nav", "user-bar"].forEach((id) => $(id).classList.add("hidden"));
    }
    async function startSession() {
      await loadAll();
      const views = viewsFor(state.me.role);
      state.activeView = views.includes("tasks") ? "tasks" : views[0];
      $("login-view").classList.add("hidden");
      ["main-wrapper", "main-nav", "user-bar"].forEach((id) => $(id).classList.remove("hidden"));
      $("user-label").textContent = state.me.name;
      $("btn-reset-demo").classList.toggle("hidden", state.me.role !== "management");
      renderAll();
    }

    // ========================================================================
    // Rendering
    // ========================================================================
    function tasksFor(role) {
      const mine = TASKS_BY_ROLE[role];
      return state.tickets
        .filter((t) => mine.includes(t.status))
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    }

    function renderAll() {
      if (!state.me) return;
      state.lastRenderAt = Date.now();
      const views = viewsFor(state.me.role);
      if (!views.includes(state.activeView)) state.activeView = views[0];

      const taskCount = tasksFor(state.me.role).length;
      $("nav-tabs").innerHTML = views.map((v) => {
        const badge = v === "tasks" && taskCount ? `<span class="count">${taskCount}</span>` : "";
        return `<button type="button" data-view-tab="${v}" class="tab ${v === state.activeView ? "active" : ""}">${VIEW_LABEL[v]} ${badge}</button>`;
      }).join("");

      ["report", "tasks", "board", "dashboard"].forEach((v) => $(`view-${v}`).classList.toggle("hidden", v !== state.activeView));
      if (state.activeView === "report") renderReport();
      if (state.activeView === "tasks") renderTasks();
      if (state.activeView === "board") renderBoard();
      if (state.activeView === "dashboard") renderDashboard();
    }

    function renderReport() {
      const sel = $("select-machine");
      const active = state.machines.filter((m) => m.status === "active");
      if (!getMachine(state.selectedMachineId) || getMachine(state.selectedMachineId).status !== "active") {
        state.selectedMachineId = active[0] ? active[0].machine_id : "";
      }
      if (!active.length) {
        sel.innerHTML = `<option value="">All machines are currently broken down</option>`;
      } else {
        sel.innerHTML = state.machines.map((m) =>
          `<option value="${m.machine_id}" ${m.status === "broken_down" ? "disabled" : ""} ${m.machine_id === state.selectedMachineId ? "selected" : ""}>${
            m.status === "broken_down" ? "● Broken — " : ""}${esc(m.name)} (${esc(m.location)})</option>`).join("");
      }
      $("btn-submit-breakdown").disabled = !active.length;
    }

    // ---- task cards -------------------------------------------------------
    const dv = (t, f) => esc(state.drafts[`${t.ticket_id}:${f}`] || "");
    const input = (t, f, attrs = "", tag = "input") =>
      tag === "textarea"
        ? `<textarea data-draft="${t.ticket_id}:${f}" rows="2" ${attrs} class="field">${dv(t, f)}</textarea>`
        : `<input data-draft="${t.ticket_id}:${f}" value="${dv(t, f)}" ${attrs} class="field" />`;
    const btn = (action, t, label, variant) =>
      `<button type="button" data-action="${action}" data-ticket="${t.ticket_id}" class="btn btn-${variant}">${label}</button>`;
    const lbl = (text) => `<div class="label mb-1.5">${text}</div>`;
    const pair = (a, b) => `<div class="grid grid-cols-2 gap-2.5">${a}${b}</div>`;

    function ticketDetails(t) {
      const rows = [];
      const row = (k, v) => rows.push(`<div class="flex gap-2"><span class="shrink-0" style="color:var(--muted); min-width:5.2rem;">${k}</span><span>${v}</span></div>`);
      if (t.issue_description) row("Issue", esc(t.issue_description));
      if (t.repair_venue) row("Repair", t.repair_venue === "in_house" ? "In-house workshop" : "Outside workshop");
      if (t.parts_required) row("Parts", esc(t.parts_required));
      if (t.dispatch_details) row("Dispatch", esc(t.dispatch_details));
      if (t.vendor_name) row("Vendor", `${esc(t.vendor_name)} — <strong>${inr(t.quote_amount)}</strong>${t.quote_details ? ` <span style="color:var(--muted);">(${esc(t.quote_details)})</span>` : ""}`);
      if (t.eta_date) row("ETA", t.eta_date);
      if (t.approval_note) rows.push(`<div class="rounded-lg px-3 py-2 mt-1" style="background:#fdeef1; color:#9f1239;"><strong>Management note:</strong> ${esc(t.approval_note)}</div>`);
      if (t.root_cause) row("Root cause", esc(t.root_cause));
      if (t.repair_cost != null) row("Repair cost", inr(t.repair_cost));
      return rows.length ? `<div class="text-[13px] space-y-1 mt-3">${rows.join("")}</div>` : "";
    }

    function taskActions(t) {
      switch (t.status) {
        case "pending_inspection":
          return `${input(t, "issue", 'placeholder="Inspection findings: what is wrong?"', "textarea")}
            ${pair(btn("inspect_in_house", t, "In-house workshop", "primary"), btn("inspect_outside", t, "Outside workshop", "outline"))}`;
        case "pending_parts_check":
          return `<div class="text-[13px]" style="color:var(--muted);">Check the site store for the spare parts.</div>
            ${input(t, "parts", 'placeholder="If not in stock: list the parts to requisition"', "textarea")}
            ${pair(btn("parts_available", t, "Parts available", "success"), btn("parts_missing", t, "Raise requisition", "outline"))}`;
        case "pending_dispatch":
          return `${input(t, "dispatch", 'placeholder="Dispatch details: vehicle, docket, quantity"')}
            <div>${lbl("Expected arrival")}<input data-draft="${t.ticket_id}:eta" type="date" value="${dv(t, "eta") || daysFromNowDate(2)}" class="field" /></div>
            ${btn("dispatch", t, "Confirm dispatch", "primary")}`;
        case "in_transit":
          return btn("receive", t, "Confirm spares received", "success");
        case "pending_quotation":
          return `${input(t, "vendor", 'placeholder="Vendor name"')}
            <input data-draft="${t.ticket_id}:amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Quoted amount (₹)" value="${dv(t, "amount")}" class="field" />
            ${input(t, "qdetails", 'placeholder="Scope, warranty, duration (optional)"')}
            <div>${lbl("Expected completion (optional)")}<input data-draft="${t.ticket_id}:eta" type="date" value="${dv(t, "eta")}" class="field" /></div>
            ${btn("quotation", t, "Submit to management", "primary")}`;
        case "pending_approval":
          return `${input(t, "note", 'placeholder="Note (required if rejecting)"')}
            ${pair(btn("approve", t, "Approve", "success"), btn("reject", t, "Reject", "danger"))}`;
        case "repair_in_progress":
          return btn("clear", t, "Mark breakdown cleared", "success");
        case "cleared":
          return `<div class="text-[13px]" style="color:var(--muted);">Downtime: <strong style="color:var(--ink);">${formatDuration(t.downtime_hours)}</strong>. Log the closure record.</div>
            ${input(t, "root", 'placeholder="Root cause"', "textarea")}
            <input data-draft="${t.ticket_id}:cost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Total repair cost (₹)" value="${dv(t, "cost")}" class="field" />
            ${input(t, "cnotes", 'placeholder="Notes (optional)"')}
            ${btn("close", t, "Close report", "primary")}`;
        default:
          return "";
      }
    }

    function ticketHeader(t) {
      const m = getMachine(t.machine_id);
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="font-semibold text-[15px] leading-snug">${esc(m ? m.name : "Machine")}</div>
          <div class="text-xs mt-0.5" style="color:var(--muted);">${esc(m ? m.location : "")} · reported ${formatDuration(hoursSince(t.created_at))} ago</div>
        </div>
        <div class="flex flex-col items-end gap-1.5">${statusBadge(t)}${slaBadge(t)}</div>
      </div>`;
    }

    function renderTasks() {
      const list = tasksFor(state.me.role);
      $("view-tasks").innerHTML = list.length === 0
        ? `<div class="card p-10 text-center"><div class="serif text-xl" style="color:var(--navy);">All clear</div><div class="text-sm mt-1" style="color:var(--muted);">Nothing is waiting on you.</div></div>`
        : list.map((t) => `
          <div class="card p-5 ${t.is_overdue ? "overdue" : ""}">
            ${ticketHeader(t)}${ticketDetails(t)}
            <div class="space-y-2.5 mt-4 pt-4" style="border-top:1px solid var(--line);">${taskActions(t)}</div>
          </div>`).join("");
    }

    function renderBoard() {
      const showClosed = $("board-show-closed").checked;
      const list = state.tickets
        .filter((t) => showClosed || t.status !== "closed")
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      $("board-list").innerHTML = list.length === 0
        ? `<div class="card p-10 text-center text-sm" style="color:var(--muted);">No breakdowns.</div>`
        : list.map((t) => {
          const open = !!state.openHistory[t.ticket_id];
          const events = state.history[t.ticket_id];
          const timeline = open
            ? `<div class="mt-4 pt-4" style="border-top:1px solid var(--line);"><div class="tl text-xs">${
              !events ? `<span style="color:var(--muted);">Loading…</span>` : events.map((e) => `
                <div class="tl-item"><div class="font-semibold">${esc((STATUS[e.to_status] || { label: e.to_status }).label)}</div>
                <div style="color:var(--muted);">${formatDateTime(e.created_at)} · ${esc(e.actor)}</div>
                ${e.note ? `<div class="mt-0.5">${esc(e.note)}</div>` : ""}</div>`).join("")}</div></div>`
            : "";
          return `<div class="card p-5 ${t.is_overdue ? "overdue" : ""}">
            ${ticketHeader(t)}${ticketDetails(t)}
            <div class="flex items-center justify-between mt-3">
              <span class="text-xs" style="color:var(--muted);">Downtime ${formatDuration(t.downtime_hours)}</span>
              <button type="button" data-history="${t.ticket_id}" class="text-xs font-semibold underline underline-offset-2" style="color:var(--navy);">${open ? "Hide history" : "History"}</button>
            </div>${timeline}</div>`;
        }).join("");
    }

    function renderDashboard() {
      const mt = state.metrics;
      if (!mt) return;
      const pastSla = Object.values(mt.overdue_by_stage).reduce((a, b) => a + b, 0);
      const kpi = (label, value, color, sub = "") =>
        `<div class="card p-4">
          <div class="label">${label}</div>
          <div class="serif text-[28px] leading-tight mt-1.5" style="color:${color};">${value}</div>
          <div class="text-xs mt-0.5" style="color:var(--muted);">${sub || "&nbsp;"}</div></div>`;
      $("kpi-row").innerHTML =
        kpi("Machines down", mt.total_machines_broken, "#be123c", `of ${state.machines.length}`) +
        kpi("Past SLA", pastSla, pastSla ? "#be123c" : "#0b6b52", pastSla ? "needs attention" : "all on track") +
        kpi("Avg downtime", mt.average_downtime_hours == null ? "—" : formatDuration(mt.average_downtime_hours), "var(--navy)", `${mt.cleared_tickets} cleared`) +
        kpi("Repair cost", inr(mt.total_repair_cost), "var(--navy)", `${mt.closed_tickets} closed`);
      $("stage-table").innerHTML = STAGE_ORDER.map((s) => {
        const over = mt.overdue_by_stage[s] || 0;
        const avg = mt.stage_average_hours[s];
        return `<tr style="border-top:1px solid var(--line);"><td class="py-3 px-5">${statusBadge({ status: s })}</td>
          <td class="py-3 px-4 text-right font-semibold">${mt.tickets_by_stage[s] || 0}</td>
          <td class="py-3 px-4 text-right font-semibold" style="color:${over ? "#be123c" : "#b4b0a6"};">${over}</td>
          <td class="py-3 px-5 text-right" style="color:var(--muted);">${avg == null ? "—" : formatDuration(avg)}</td></tr>`;
      }).join("");
    }

    // ========================================================================
    // Actions
    // ========================================================================
    function field(id, name) {
      const el = document.querySelector(`[data-draft="${id}:${name}"]`);
      return el ? el.value.trim() : "";
    }
    function fail(msg) { showToast(msg, true); }

    async function runTaskAction(action, id) {
      const put = (path, body) => () => apiRequest("PUT", `/api/tickets/${id}/${path}`, body);
      switch (action) {
        case "inspect_in_house":
        case "inspect_outside": {
          const issue = field(id, "issue");
          if (issue.length < 3) return fail("Enter the inspection findings first.");
          return act(put("inspect", { issue_description: issue, repair_venue: action === "inspect_in_house" ? "in_house" : "outside" }),
            action === "inspect_in_house" ? "Sent to in-house workshop." : "Sent for outside repair quotation.", id);
        }
        case "parts_available":
          return act(put("parts-check", { available: true }), "Spares available. Repair started.", id);
        case "parts_missing": {
          const parts = field(id, "parts");
          if (!parts) return fail("List the parts to requisition.");
          return act(put("parts-check", { available: false, parts_required: parts }), "Requisition sent to central store.", id);
        }
        case "dispatch": {
          const details = field(id, "dispatch"), eta = field(id, "eta");
          if (details.length < 2 || !eta) return fail("Enter dispatch details and the arrival date.");
          return act(put("dispatch", { dispatch_details: details, eta_date: eta }), "Dispatch recorded.", id);
        }
        case "receive":
          return act(put("receive", null), "Receipt confirmed. Repair started.", id);
        case "quotation": {
          const vendor = field(id, "vendor"), amount = parseFloat(field(id, "amount"));
          if (vendor.length < 2) return fail("Enter the vendor name.");
          if (!(amount > 0)) return fail("Enter the quoted amount.");
          return act(put("quotation", { vendor_name: vendor, quote_amount: amount, quote_details: field(id, "qdetails") || null, eta_date: field(id, "eta") || null }),
            "Quotation sent to management.", id);
        }
        case "approve":
          return act(put("approval", { approved: true, note: field(id, "note") || null }), "Quotation approved.", id);
        case "reject": {
          const note = field(id, "note");
          if (!note) return fail("Give a reason for rejecting.");
          return act(put("approval", { approved: false, note }), "Quotation sent back.", id);
        }
        case "clear":
          return act(put("clear", null), "Breakdown cleared. Machine is active again.", id);
        case "close": {
          const root = field(id, "root"), cost = parseFloat(field(id, "cost"));
          if (root.length < 3) return fail("Enter the root cause.");
          if (!(cost >= 0)) return fail("Enter the total repair cost (0 if none).");
          return act(put("close", { root_cause: root, repair_cost: cost, closure_notes: field(id, "cnotes") || null }), "Report closed.", id);
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      $("btn-close-toast").addEventListener("click", () => $("toast-container").classList.add("hidden"));

      $("nav-tabs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-view-tab]");
        if (!b) return;
        state.activeView = b.getAttribute("data-view-tab");
        renderAll();
      });

      $("btn-reset-demo").addEventListener("click", async () => {
        if (!confirm("Delete all tickets and restore the demo data?")) return;
        state.drafts = {};
        await act(() => apiRequest("POST", "/api/reset-demo"), "Demo data reset.");
      });

      $("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errEl = $("login-error");
        errEl.classList.add("hidden");
        try {
          const res = await apiRequest("POST", "/api/auth/login", {
            username: $("login-username").value.trim(),
            password: $("login-password").value
          });
          localStorage.setItem(TOKEN_KEY, res.token);
          $("login-password").value = "";
          await startSession();
        } catch (err) {
          errEl.textContent = err.message;
          errEl.classList.remove("hidden");
        }
      });
      $("btn-logout").addEventListener("click", showLogin);

      $("select-machine").addEventListener("change", (e) => { state.selectedMachineId = e.target.value; });
      $("form-create-breakdown").addEventListener("submit", async (e) => {
        e.preventDefault();
        const machine = getMachine(state.selectedMachineId);
        if (!machine || machine.status !== "active") return;
        await act(() => apiRequest("POST", "/api/tickets/create", { machine_id: machine.machine_id }), `Breakdown reported for ${machine.name}`);
      });

      // Keep typed text across re-renders.
      $("view-tasks").addEventListener("input", (e) => {
        const key = e.target.getAttribute("data-draft");
        if (key) state.drafts[key] = e.target.value;
      });
      $("view-tasks").addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (b) runTaskAction(b.getAttribute("data-action"), b.getAttribute("data-ticket"));
      });

      $("board-show-closed").addEventListener("change", renderBoard);
      $("board-list").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-history]");
        if (!b) return;
        const id = b.getAttribute("data-history");
        state.openHistory[id] = !state.openHistory[id];
        renderBoard();
        if (state.openHistory[id]) {
          try {
            state.history[id] = await apiRequest("GET", `/api/tickets/${id}/events`);
            renderBoard();
          } catch (err) { showToast(err.message, true); }
        }
      });

      setInterval(pullFromServerIfIdle, 6000);
      if (localStorage.getItem(TOKEN_KEY)) startSession().catch(showLogin);
      else showLogin();
    });
  </script>
</body>
</html>
